source = ~/.config/hypr/settings.conf
# ── Background (blur) ───────────────────────────────────────────────
# Если у вас уже настроен «wallpaper», просто добавьте blur‑эффект
# (можно менять степень размытия через «blur_size»)
background {
    # путь к вашей картинке‑фонту, либо «color = #000000» для чёрного
    path = "/usr/share/hypr/wall2.png"
    blur {
        enabled = true          # включаем размытие
        size    = 8             # степень размытия (1–20)
        passes  = 1
    }
}

# ── Large clock ─────────────────────────────────────────────────────
clock {
    enabled   = true
    format    = "%H:%M"          # 24‑часовой формат, меняйте при желании
    font      = "JetBrainsMono Nerd Font"   # ваш любимый шрифт
    size      = 120              # размер цифр (можно подстроить)
    color     = "rgba(255,255,255,0.9)"   # почти белый, слегка прозрачный
    position  = "center"        # центр экрана
}

