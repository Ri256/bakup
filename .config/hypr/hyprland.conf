# -------------------------------------------------
# 1. Общие параметры
# -------------------------------------------------
monitor=DP-1,1920x1080@60,0x0,1      # имя монитора, разрешение, позиция, масштаб
cursor_theme = Bibata-Modern-Ice  # тема курсора
cursor_size = 24

# -------------------------------------------------
# 2. Приложения, которые открывать в плавающем режиме
# -------------------------------------------------
# windowrule = togglefloating, ^(pavucontrol)$
# windowrule = togglefloating, ^(nm-connection-editor)$

# -------------------------------------------------
# 3. Привязка горячих клавиш (bind)
# -------------------------------------------------
# Формат: bind = <мод>, <клавиша>, <команда>
# <мод> может быть SUPER, ALT, CONTROL, SHIFT (можно комбинировать через +)
# <команда> – действие (exec, killactive, togglefloating, ...)

# Запуск часто‑используемых программ
bind = SUPER, Return, exec, kitty			# терминал
bind = SUPER, S, exec, rofi -show drun			# лаунчер
bind = SUPER, F, exec, firefox				# браузер
bind = SUPER, E, exec, yazi file manager		# файловый менеджер
bind = SUPER, T, exec, konsole				# терминал
bind = SUPER, D, exec, discover				# Центр программ
bind = SUPER, B, exec, btop++				# Монитор процессов
bind = SUPER, V, exec, oracle virtualbox		#Виртуалки

# Управление окнами
bind = SUPER, Q, killactive                            # закрыть активное окно
bind = SUPER, O, fullscreen                            # полноэкранный режим
bind = SUPER, P, togglefloating                       # переключить статус «плавающее»
# bind = Alt, Tab, exec, ~/.config/hypr/scripts/alt-tab.sh 		   # поменять активное окно на следующие
# bind = Alt Shift, Tab, exec, ~/.config/hypr/scripts/alt-tab.sh --reverse   # поменять актовное окно на предыдущие

# Перемещение/изменение размеров
bind = SUPER, H, movewindow, l                        # сдвинуть окно влево
bind = SUPER, L, movewindow, r                        # сдвинуть окно вправо
bind = SUPER, K, movewindow, u                        # сдвинуть окно вверх
bind = SUPER, J, movewindow, d                        # сдвинуть окно вниз
bind = SUPER+SHIFT, H, resizeactive, -20 0           # укоротить ширину
bind = SUPER+SHIFT, L, resizeactive, 20 0            # увеличить ширину
bind = SUPER+SHIFT, K, resizeactive, 0 -20           # укоротить высоту
bind = SUPER+SHIFT, J, resizeactive, 0 20            # увеличить высоту

# Переключение рабочих пространств
bind = SUPER, 1, workspace, 1 
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Раскладка
input {
	kb_layout = us,ru
	kb_options = grp:alt_shift_toggle
}

# Интернет, WiFi
bind = SUPER, A, exec, nm-connection-editor

exec-once = nm-applet --indicato

bind = SUPER, N, exec, networkmanager_dmenu

# Bluetooth
bind = SUPER, W, exec, blueman-manager

# Перемещение окна на другое рабочее пространство
bind = SUPER+SHIFT, 1, movetoworkspace, 1
bind = SUPER+SHIFT, 2, movetoworkspace, 2
bind = SUPER+SHIFT, 3, movetoworkspace, 3
bind = SUPER+SHIFT, 4, movetoworkspace, 4
bind = SUPER+SHIFT, 5, movetoworkspace, 5

# -------------------------------------------------
# 4. Тема и оформление
# -------------------------------------------------
# Цвета берутся из css‑подобного формата
# (можно использовать любой готовый набор, например из https://github.com/hyprwm/Hyprland/wiki/Config-Examples)
general {
    border_size = 2
    col.active_border = rgba(33,150,243,0.8)
    col.inactive_border = rgba(200,200,200,0.5)
#     col.background = rgba(0,0,0,0.9)
}
# -------------------------------------------------
# 5. Изменение яркости
# -------------------------------------------------

binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Управление громкостью (удерживание = повторение)
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
binde = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle


exec-once = hyprpaper
exec-once = waybar

bind = SUPER, D, exec, rofi -show drun

# Хранитель экрана
exec-once = hypridle
# bind = SUPER, C, exec, hyprlock

#------------------------------------------------
# 6. Обои
#------------------------------------------------

exec = swaybg -i /home/rinas/.local/share/wallpapers/Anime-1.jpg -m fill

env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

misc {
	disable_hyprland_logo = true
}

#-------------------------------------------------
# 7. Блюр и эффекты.
#-------------------------------------------------

decoration {
	rounding = 10		#сгругление углов

	blur {
		enabled = true
		size = 8		#радиус размытия
		passes = 3		#Количество проходов
		new_optimizations = true
	}
}

#Правила для Kitty

windowrule = match:class ^(kitty)$, opacity 0.75 0.75

#Правила для Alacritty

windowrule = match:class ^(Alacritty)$, opacity 0.75 0.75


